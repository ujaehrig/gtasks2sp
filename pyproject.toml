[project]
name = "tasks2sp"
version = "0.1.0"
description = "Import open Google Tasks into Super Productivity"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --cov=tasks2sp --cov-branch --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["tasks2sp.py", "tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]
